<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background-image: url("background.bali.png");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Tombol back (kiri atas) */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 30px;
            color: white;
            cursor: pointer;
            user-select: none;
        }

        /* Card */
        .card {
            width: 500px;
            padding: 40px 30px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            position: relative;
            text-align: center;
            color: white;
        }

        /* Logo pojok kanan */
        .logo-top {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 70px;
            height: auto;
            opacity: 0.9;
        }

        h2 {
            font-size: 32px;
            margin-bottom: 25px;
            margin-top: 20px;
        }

        .input-box {
            width: 100%;
            margin: 12px 0;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.75);
            font-size: 16px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            width: 140px;
            margin-top: 20px;
            background: white;
            color: black;
        }
    </style>

</head>

<body>

    <!-- Tombol Back -->
    <div class="back-btn" onclick="window.location.href='LoginWeb.html'"></div>

    <!-- Card -->
    <div class="card">

        <!-- Logo -->
        <img src="Logo.img.png" class="logo-top">

        <h2>Signup</h2>

        <div class="input-box">
            <input type="text" placeholder="Enter name">
        </div>

        <div class="input-box">
            <input type="email" placeholder="Gmail">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password">
        </div>


        <button class="btn btn-dark" onclick="window.location.href='LoginWeb.html'">Sign Up</button>
        <button class="btn btn-dark" onclick="window.location.href='homepage2.html'">Next</button>

    </div>

</body>

</html>
