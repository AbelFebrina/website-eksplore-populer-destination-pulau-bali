<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantai Kuta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .left {
            width: 60%;
            position: relative;
            color: white;
        }

        .left img.bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(60%);
            position: absolute;
            top: 0;
            left: 0;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
        }

        .content {
            position: absolute;
            bottom: 20%;
            left: 10%;
            right: 10%;
        }

        .title {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .desc {
            width: 80%;
            font-size: 16px;
            line-height: 1.6;
        }

        .right {
            width: 40%;
            background: #fff;
            padding: 30px 40px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        nav a {
            text-decoration: none;
            margin-right: 20px;
            font-weight: 500;
            color: #333;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .profile img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
        }

        h2 {
            margin-bottom: 15px;
        }

        .cards {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 20px;
        }

        .card {
            min-width: 220px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            flex-shrink: 0;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .wishlist {
            border: none;
            width: 100%;
            padding: 12px;
            cursor: pointer;
            background: #f5f5f5;
            font-weight: 600;
            border-radius: 10px;
            margin-top: 15px;
        }

        .wishlist.active {
            background: #ff4d6d;
            color: white;
        }
    </style>
</head>

<body>
    <div class="left">
        <img src="imgWishlist.png" class="bg">
        <div class="Logo.img">Eksplore</div>
        <div class="content">
            <div class="title">Pantai Kuta</div>
            <div class="desc">tempat ini dikenal sebagai salah satu tempat berselancar terbaik di Bali, terutama bagi
                pemula, berkat ombaknya yang konsisten dan banyaknya sekolah selancar yang menawarkan les</div>
        </div>
    </div>

    <div class="right">
        <nav>
            <div>
                <a href="#">HOME</a>
                <a href="#">CONTACT</a>
                <a href="#">LOCATION</a>
            </div>
            <div class="profile">
                <img src="https://i.pravatar.cc/100?img=12">
                <span>Eleanor<br><small>18/02/2018</small></span>
            </div>
        </nav>

        <h2>Views</h2>
        <div class="cards">
            <div class="card">
                <img src="pantai_kutabali.png">
            </div>

            <div class="card">
                <img src="img8.png">
            </div>

            <div class="card">
                <img src="img9.png">
            </div>
        </div>

        <button class="wishlist" onclick="toggleWish(this)">Add wishlist ♡</button>
    </div>

    <script>
        function toggleWish(btn) {
            btn.classList.toggle("active");
            btn.textContent = btn.classList.contains("active") ? "Wishlisted ❤" : "Add wishlist ♡";
        }
    </script>

</body>

</html>
